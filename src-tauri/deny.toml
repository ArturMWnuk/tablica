# cargo-deny configuration (NF-01): Rust dependencies must use licenses compatible with GPL-3.0.
# Mirrors the npm policy in scripts/license-policy.mjs.

[graph]
all-features = false

[licenses]
confidence-threshold = 0.9
# The list is shared across platforms; not every license appears on every target.
unused-allowed-license = "allow"
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "GPL-3.0-only",
  "ISC",
  "LGPL-2.1-or-later",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[licenses.private]
ignore = true
