[package]
name = "tablica"
version = "0.0.1"
description = "Modular whiteboard for remote teaching"
authors = ["Artur Wnuk"]
license = "GPL-3.0-only"
repository = "https://github.com/ArturMWnuk/tablica"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
# staticlib and cdylib are needed for the Android build.
name = "tablica_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
